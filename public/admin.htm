<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aevora Admin</title>
    <style>
        :root { --bg:#f3f1ec; --panel:#ffffff; --card:#fbfaf7; --text:#26221c; --muted:#7a7063; --accent:#a28f76; --ok:#2e8b57; --warn:#b47f35; --bad:#b24b45; }
        *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Roboto,sans-serif}
        body{background:var(--bg);color:var(--text);min-height:100vh;display:grid;grid-template-columns:240px 1fr}
        aside{background:#f6f3ec;border-right:1px solid #ddd5c9;padding:16px}
        .brand{font-size:1.1rem;font-weight:700;margin-bottom:18px}
        .nav-item{display:block;padding:10px;border-radius:10px;color:var(--muted);margin-bottom:6px}
        .nav-item.active,.nav-item:hover{background:#ece4d8;color:#3b342c}
        main{padding:20px}
        .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
        .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
        .kpi{background:var(--panel);padding:12px;border:1px solid #ddd5c9;border-radius:12px}
        .kpi h4{color:var(--muted);font-size:.78rem;margin-bottom:6px}
        .kpi p{font-size:1.4rem;font-weight:700}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .card{background:var(--card);border:1px solid #ddd5c9;border-radius:12px;padding:12px}
        .list{margin-top:8px}
        .list li{display:flex;justify-content:space-between;border-bottom:1px solid #ddd5c9;padding:7px 0;font-size:.86rem}
        .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
        @media(max-width:860px){body{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <aside>
        <div class="brand">AEVORA Admin</div>
        <a class="nav-item active" href="#">Overview</a>
        <a class="nav-item" href="/index.htm">Go to App</a>
        <a class="nav-item" href="#">Users</a>
        <a class="nav-item" href="#">Recommendations</a>
        <a class="nav-item" href="#">Content Moderation</a>
    </aside>
    <main>
        <div class="head">
            <h2>Recommendation Analytics Dashboard</h2>
            <button onclick="loadSummary()" style="padding:8px 12px;border-radius:9px;border:1px solid #d5ccbf;background:#efe7da;color:#3b342c;cursor:pointer;">Refresh</button>
        </div>
        <section class="kpis">
            <div class="kpi"><h4>Total Users</h4><p id="users">0</p></div>
            <div class="kpi"><h4>Total Searches</h4><p id="searches">0</p></div>
            <div class="kpi"><h4>Likes</h4><p id="likes" class="ok">0</p></div>
            <div class="kpi"><h4>Dislikes</h4><p id="dislikes" class="bad">0</p></div>
            <div class="kpi"><h4>Engagement Rate</h4><p id="engagement" class="warn">0</p></div>
        </section>
        <section class="grid">
            <article class="card">
                <h3>Most Liked Items</h3>
                <ul id="top-liked" class="list"></ul>
            </article>
            <article class="card">
                <h3>Most Disliked Items</h3>
                <ul id="top-disliked" class="list"></ul>
            </article>
        </section>
    </main>
    <script>
        const DEFAULT_API_PORT = '3000';
        const API_BASE = (() => {
            if (typeof window.__AEVORA_API_BASE__ === 'string' && window.__AEVORA_API_BASE__.length) {
                return window.__AEVORA_API_BASE__.replace(/\/$/, '');
            }
            const isLocalHost = /^(localhost|127\.0\.0\.1)$/i.test(location.hostname || '');
            if (isLocalHost && location.port && location.port !== DEFAULT_API_PORT) {
                return `http://127.0.0.1:${DEFAULT_API_PORT}`;
            }
            if (location.protocol === 'file:') return `http://127.0.0.1:${DEFAULT_API_PORT}`;
            return '';
        })();
        function apiUrl(path) {
            const p = path.startsWith('/') ? path : `/${path}`;
            return `${API_BASE}${p}`;
        }
        function formatFetchError(err) {
            const msg = err && err.message ? String(err.message) : 'Request failed';
            if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) {
                if (location.protocol === 'file:') {
                    return 'Open this app via http://127.0.0.1:' + DEFAULT_API_PORT + '/admin.htm (not as a local file).';
                }
                return 'Cannot reach API. Start the server with npm start.';
            }
            return msg;
        }
        function renderList(el, rows) {
            el.innerHTML = '';
            if (!rows.length) {
                el.innerHTML = '<li><span>No data yet</span><span>0</span></li>';
                return;
            }
            for (const row of rows) {
                const li = document.createElement('li');
                li.innerHTML = `<span>${row.title}</span><strong>${row.count}</strong>`;
                el.appendChild(li);
            }
        }
        async function loadSummary() {
            let res;
            try {
                res = await fetch(apiUrl('/api/v1/admin/summary'));
            } catch (e) {
                alert(formatFetchError(e));
                return;
            }
            let data;
            try {
                data = await res.json();
            } catch {
                alert('Invalid response from admin API.');
                return;
            }
            if (!data.success) {
                alert(data.error || 'Could not load analytics.');
                return;
            }
            const a = data.analytics;
            document.getElementById('users').textContent = a.users;
            document.getElementById('searches').textContent = a.searchCount;
            document.getElementById('likes').textContent = a.likeCount;
            document.getElementById('dislikes').textContent = a.dislikeCount;
            document.getElementById('engagement').textContent = a.engagementRate;
            renderList(document.getElementById('top-liked'), a.topLiked || []);
            renderList(document.getElementById('top-disliked'), a.topDisliked || []);
        }
        loadSummary();
    </script>
</body>
</html>
